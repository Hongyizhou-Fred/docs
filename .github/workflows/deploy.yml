name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # 三个 region app 各自独立构建(monorepo:apps/hk apps/sg apps/us,
      # 共享层在 packages/shared)。每个 app base=/{region}/,产物合并后
      # 对外 URL 与拆分前的单实例时代完全一致。
      - name: Build all region apps
        run: bun run build

      - name: Merge dists (single-domain layout)
        run: |
          mkdir -p dist
          cp -r apps/hk/docs/.vitepress/dist dist/hk
          cp -r apps/sg/docs/.vitepress/dist dist/sg
          cp -r apps/us/docs/.vitepress/dist dist/us
          # 根 404 兜底(GitHub Pages 只认根 /404.html);hk 产物的 404 引用
          # /hk/assets/* 绝对路径,放到根也能正常工作
          cp apps/hk/docs/.vitepress/dist/404.html dist/404.html
          # 根路径重定向到默认 region
          cp .github/pages-root/index.html dist/index.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
